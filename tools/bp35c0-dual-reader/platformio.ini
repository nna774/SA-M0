; 2台のCube J1から抜いたBP35C0基板2枚に、自動でBルートJOINして定期的にECHONET Liteの
; GETを投げ続ける常駐ファーム。配線はbp35c0-dual-probeと同じ。README.md参照。

[env:esp32-c3]
; pioarduino/platform-espressif32が公式と同じ"espressif32"を名乗るため、バージョン
; 無指定だとどちらを掴むかがマシンの状態次第になる。
platform = platformio/espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    ; USB-シリアル変換を積まないC3ボード(SuperMini等)でSerialをネイティブUSBのCDCに出す。
    ; ESP32-C3はUARTコントローラがUART0/UART1の2個しかないが、コンソールをここでUSB CDCへ
    ; 逃がすことでUART0が丸ごと空き、2枚のBP35C0をUART0/UART1それぞれの純ハードウェアUARTで
    ; 同時に扱える。
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; bp35c0-dual-probeと同じ配線・同じピン
    -DBP35C0_1_RX_PIN=4
    -DBP35C0_1_TX_PIN=5
    -DBP35C0_1_RESET_PIN=6
    -DBP35C0_2_RX_PIN=7
    -DBP35C0_2_TX_PIN=10
    -DBP35C0_2_RESET_PIN=3
build_unflags =
    -std=gnu++11
